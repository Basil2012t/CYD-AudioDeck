[platformio]
default_envs = cyd_ili9341_2

[env]
platform = espressif32@6.6.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.flash_size = 4MB
board_build.partitions = huge_app.csv
board_build.flash_mode = dio
board_build.f_flash = 40000000L
build_flags =
  -D USER_SETUP_LOADED
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320
  -D TFT_MISO=12
  -D TFT_MOSI=13
  -D TFT_SCLK=14
  -D TFT_CS=15
  -D TFT_DC=2
  -D TFT_RST=-1
  -D TFT_BL=21
  -D TOUCH_CS=33
  -D SPI_FREQUENCY=40000000
  -D LOAD_GLCD
  -D LOAD_FONT2
  -D LOAD_FONT4
lib_deps =
  bodmer/TFT_eSPI
  https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4
  earlephilhower/ESP8266Audio
  https://github.com/pschatzmann/ESP32-A2DP.git

[env:cyd_ili9341]
build_flags = ${env.build_flags} -D ILI9341_DRIVER

[env:cyd_ili9341_2]
build_flags = ${env.build_flags} -D ILI9341_2_DRIVER

[env:cyd_st7789]
build_flags = ${env.build_flags} -D ST7789_DRIVER
